name: Uptime check
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check https://hopewick.com.au/api/health
        id: check
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o body.txt -w '%{http_code}' --max-time 20 https://hopewick.com.au/api/health || echo 000)
            if [ "$code" = "200" ] && grep -q '"ok":true' body.txt; then echo "Healthy ($code)"; exit 0; fi
            echo "Attempt $i: HTTP $code"; sleep 20
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 1
      - name: Open or update an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Uptime: /api/health failing"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing at $(date -u +%FT%TZ). Run: $url"
          else
            gh issue create --title "$title" --body "https://hopewick.com.au/api/health did not return 200 {\"ok\":true} after 3 tries at $(date -u +%FT%TZ). Run: $url"
          fi
