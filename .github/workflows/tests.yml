name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The pg-import test skips itself when pg is not installed.
      - run: node --test --test-concurrency=1 server/*.test.mjs tests/*.test.mjs
